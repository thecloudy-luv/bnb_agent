[project]
name = "my-agent"
version = "0.1.0"
description = "BNB Chain Set and Earn AI Agent"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "bnbagent==0.5.0",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pillow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "src",
]
